name: CI Diagnostic

on:
  push:
    branches:
      - chatgpt/agent-completion-v2
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q app tests
      - name: Test
        id: backend_tests
        continue-on-error: true
        env:
          APP_MODE: development
          ENABLE_DEMO_DATA: "true"
        run: pytest -q
      - name: Report backend test outcome
        run: echo "backend_tests_outcome=${{ steps.backend_tests.outcome }}"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Frontend tests
        id: frontend_tests
        continue-on-error: true
        run: npm test
      - name: Frontend build
        id: frontend_build
        continue-on-error: true
        run: npm run build
      - name: Report frontend outcomes
        run: echo "frontend_tests=${{ steps.frontend_tests.outcome }} frontend_build=${{ steps.frontend_build.outcome }}"
