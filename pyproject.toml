[project]
name = "scientific-research-analysis-agent"
version = "0.1.0"
description = "Unified scientific analysis agent demo"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "matplotlib>=3.9,<4",
  "duckdb>=1.1,<2",
  "sqlglot>=26,<30",
  "pyyaml>=6,<7",
  "langgraph>=1.0.7,<2",
  "langchain>=1.2.7,<2",
  "langchain-core>=1.2.7,<2",
  "langchain-openai>=1.0.2,<2",
  "deepagents==0.5.1",
  "langgraph-checkpoint-postgres>=3.0.5,<4",
  "psycopg[binary,pool]>=3.2,<4",
  "minio>=7.2,<8",
  "mcp>=1.20,<2",
  "rank-bm25>=0.2.2,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "web*", "data*", "skills*", "docker*"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "httpx>=0.27,<1", "selenium>=4.29,<5"]
evaluation = ["sentence-transformers>=5.7,<6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

