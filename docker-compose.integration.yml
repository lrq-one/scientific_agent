services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scientific_agent
      POSTGRES_USER: scientific
      POSTGRES_PASSWORD: scientific
    ports:
      - "55433:5432"
    volumes:
      - scientific_agent_p1_integration_postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scientific -d scientific_agent"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r3
    command: server /bitnami/minio/data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: change-me
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - scientific_agent_p1_integration_minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  scientific_agent_p1_integration_postgres_data:
    name: scientific_agent_p1_integration_postgres_data
  scientific_agent_p1_integration_minio_data:
    name: scientific_agent_p1_integration_minio_data
